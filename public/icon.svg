    <circle cx="180" cy="320" r="15" fill="white"/>
    <circle cx="340" cy="320" r="30" fill="#1e40af"/>
    <circle cx="340" cy="320" r="15" fill="white"/>
    <!-- Chart bars -->
    <rect x="140" y="360" width="40" height="80" rx="4" opacity="0.8"/>
    <rect x="200" y="340" width="40" height="100" rx="4" opacity="0.8"/>
    <rect x="260" y="380" width="40" height="60" rx="4" opacity="0.8"/>
    <rect x="320" y="350" width="40" height="90" rx="4" opacity="0.8"/>
    <!-- QE text -->
    <text x="256" y="160" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="white">QE</text>
  </g>
</svg>
